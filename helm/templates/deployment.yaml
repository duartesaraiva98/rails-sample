apiVersion: apps/v1
kind: Deployment
metadata:
  name: rails-sample
  namespace: {{ .Release.Namespace }}
  labels:
    app: rails-sample
    zorgdomein.nl/logtype: component
#    fluentbit.io/parser: json
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rails-sample
  template:
    metadata:
      labels:
        app: rails-sample
    spec:
      containers:
        - name: rails-sample
          image: "rails-sample:{{ .Chart.AppVersion }}"
          ports:
          - containerPort: 3000
          env:
          - name: RAILS_ENV
            value: "production"
{{- with .Values.extraEnv }}
          {{- toYaml . | nindent 10 }}
{{- end }}
          resources:
            requests:
              memory: "128Mi"
              cpu: "500m"
            limits:
              memory: "256Mi"
              cpu: "1000m"